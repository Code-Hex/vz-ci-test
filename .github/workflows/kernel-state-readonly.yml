name: Intel kernel field read-only snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - name: Check out the selected diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the filtered kernel fields
        run: |
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 scripts/kernel_state_readonly.py
      - name: Preserve the filtered snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-state-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/kernel-state-readonly.json
          if-no-files-found: warn

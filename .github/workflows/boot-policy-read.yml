name: Intel boot argument policy inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26-intel
    timeout-minutes: 3
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect startup file metadata and selected literals
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/boot-policy-read.py
      - name: Preserve the filtered inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-policy-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/boot-policy-read.json
          if-no-files-found: error

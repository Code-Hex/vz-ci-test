name: UDP socket connection control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' }}
    name: UDP connection control (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: intel
            os: macos-26-intel
          - role: receiver
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    permissions:
      contents: read
      checks: write
    env:
      KDP_ROLE: ${{ matrix.role }}
      KDP_PORT_MODE: kernel-source
      KDP_STUN_HOST: stun.cloudflare.com
      KDP_STUN_PORT: '3478'
    steps:
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare connection state with the same sockets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/udp_connection_control.py
      - name: Preserve the filtered comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: udp-connection-control-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/udp-connection-control.json
          if-no-files-found: warn

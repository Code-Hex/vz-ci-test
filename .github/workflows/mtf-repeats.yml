name: Intel MOV entry repetitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the signed native probe
        run: bash scripts/build-hypervisor.sh
      - name: Repeat MOV without executing HLT
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify-mtf-repeats.py "$RUNNER_TEMP/debug/probes/hypervisor"
      - name: Preserve received observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mtf-repeats-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/mtf-repeats/
          if-no-files-found: warn

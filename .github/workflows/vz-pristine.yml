name: Intel pristine Linux verification

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of full suite executions on the same runner
        type: choice
        options: ['1', '2']
        default: '1'

      workload:
        description: Test command
        type: choice
        options: ['package', 'ci']
        default: 'package'

      go-version:
        description: Go toolchain
        type: choice
        options: ['1.26.8', '1.26.10', '1.27.3']
        default: '1.26.8'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Run the unchanged Linux suite
        env:
          ITERATIONS: ${{ inputs.iterations }}
          WORKLOAD: ${{ inputs.workload }}
          GO_VERSION: ${{ inputs.go-version }}
        run: bash scripts/verify-vz-pristine.sh "$ITERATIONS" "$WORKLOAD" "$GO_VERSION"
      - name: Preserve test output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vz-pristine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/vz-pristine-output.log
          retention-days: 1
          if-no-files-found: warn

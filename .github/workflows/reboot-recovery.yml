name: Intel reboot and panic recovery

on:
  workflow_dispatch:
    inputs:
      netdump_synthetic_capture_only:
        description: Check independent encrypted capture after the sender exits
        required: false
        type: boolean
        default: false
      netdump_discovery_only:
        description: Check the receiver and host plan without rebooting
        required: false
        type: boolean
        default: false
      cleanup_check:
        description: Unfinished recovery check from an earlier run
        required: false
        type: string
        default: ''
      trigger:
        description: Recovery control to run
        required: true
        type: choice
        options:
          - reboot
          - reboot-quick
          - panic-control
          - panic-force-reset
        default: reboot
      debug_boot:
        description: Inspect debug boot settings after a non-panic reboot
        required: false
        type: boolean
        default: false
      debug_source:
        description: Boot argument source for the debug quick reboot
        required: false
        type: choice
        options:
          - nvram
          - bootplist
        default: nvram
      after_debug_boot:
        description: Follow-up after a verified debug boot
        required: false
        type: choice
        options:
          - none
          - panic-nonce
          - panic-nonce-nvram-off
          - panic-nonce-usdt
          - netdump-prime
          - panic-nonce-netdump
        default: none
      report_cert:
        description: Public recipient certificate for encrypted panic reports
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  controller:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' && !inputs.netdump_discovery_only && !inputs.netdump_synthetic_capture_only }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.after_debug_boot != 'none' && 20 || 12 }}
    env:
      RECOVERY_TRIGGER: ${{ inputs.trigger || 'reboot' }}
      RECOVERY_DEBUG_BOOT: ${{ inputs.debug_boot && '1' || '0' }}
      RECOVERY_DEBUG_SOURCE: ${{ inputs.debug_source }}
      RECOVERY_AFTER_DEBUG_BOOT: ${{ inputs.after_debug_boot }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep the recovery controller token alive until completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_CLEANUP_CHECK_ID: ${{ inputs.cleanup_check }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/reboot-recovery.py controller
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' && !inputs.netdump_discovery_only && !inputs.netdump_synthetic_capture_only }}
    runs-on: macos-26-intel
    timeout-minutes: ${{ inputs.after_debug_boot != 'none' && 20 || 12 }}
    env:
      RECOVERY_TRIGGER: ${{ inputs.trigger || 'reboot' }}
      RECOVERY_DEBUG_BOOT: ${{ inputs.debug_boot && '1' || '0' }}
      RECOVERY_DEBUG_SOURCE: ${{ inputs.debug_source }}
      RECOVERY_AFTER_DEBUG_BOOT: ${{ inputs.after_debug_boot }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the guarded force-reset helper
        if: ${{ inputs.trigger == 'panic-force-reset' }}
        run: xcrun clang -arch x86_64 -mmacosx-version-min=12.0 -std=c11 -Wall -Wextra -Werror -O1 probes/reboot_force_reset.c -o "$RUNNER_TEMP/recovery-force-reset"
      - name: Build the guarded quick-reboot helper
        if: ${{ inputs.trigger == 'reboot-quick' }}
        run: xcrun clang -arch x86_64 -mmacosx-version-min=12.0 -std=c11 -Wall -Wextra -Werror -O1 probes/reboot_quick.c -o "$RUNNER_TEMP/recovery-quick-reboot"
      - name: Build the guarded NVRAM synchronization helper
        if: ${{ inputs.debug_boot && inputs.trigger == 'reboot-quick' && inputs.debug_source == 'nvram' }}
        run: xcrun clang -arch x86_64 -mmacosx-version-min=12.0 -std=c11 -Wall -Wextra -Werror -O1 probes/nvram_backend.c -framework IOKit -framework CoreFoundation -o "$RUNNER_TEMP/recovery-nvram-backend"
      - name: Publish the runner recovery public key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_REPORT_CERT: ${{ inputs.report_cert }}
          RECOVERY_FORCE_HELPER: ${{ runner.temp }}/recovery-force-reset
          RECOVERY_QUICK_HELPER: ${{ runner.temp }}/recovery-quick-reboot
          RECOVERY_NVRAM_HELPER: ${{ runner.temp }}/recovery-nvram-backend
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/reboot-recovery.py prepare
      - name: Receive the controller token and verify the armed reporter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/reboot-recovery.py arm
      - name: Run the recovery control on the disposable runner
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/reboot-recovery.py trigger
  netdump_discovery:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' && inputs.netdump_discovery_only }}
    name: Netdump discovery ${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: intel
            command: discover
            os: macos-26-intel
          - role: receiver
            command: receiver
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    permissions:
      contents: read
      checks: write
    env:
      KDP_ROLE: ${{ matrix.role }}
      KDP_PORT_MODE: kernel-source
      KDP_STUN_HOST: stun.cloudflare.com
      KDP_STUN_PORT: '3478'
    steps:
      - name: Reject conflicting network and after-boot controls
        env:
          AFTER_DEBUG_BOOT: ${{ inputs.after_debug_boot || 'none' }}
          SYNTHETIC_CAPTURE: ${{ inputs.netdump_synthetic_capture_only && '1' || '0' }}
        run: |
          if [ "$AFTER_DEBUG_BOOT" != none ] || [ "$SYNTHETIC_CAPTURE" != 0 ]; then
            echo 'Choose one network-only control or one after-boot control.' >&2
            exit 1
          fi
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Discover the bounded network plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KDP_REPORT_CERT: ${{ inputs.report_cert }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/recovery_netdump.py ${{ matrix.command }}
      - name: Preserve the filtered discovery result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netdump-discovery-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/netdump-discovery.json
          if-no-files-found: warn
  netdump_receiver:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' && !inputs.netdump_discovery_only && !inputs.netdump_synthetic_capture_only && (inputs.after_debug_boot == 'netdump-prime' || inputs.after_debug_boot == 'panic-nonce-netdump') && inputs.debug_boot && inputs.debug_source == 'bootplist' && inputs.trigger == 'reboot-quick' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      KDP_ROLE: receiver
      KDP_PORT_MODE: kernel-source
      KDP_STUN_HOST: stun.cloudflare.com
      KDP_STUN_PORT: '3478'
      NETDUMP_RECEIVER_COMMAND: ${{ inputs.after_debug_boot == 'panic-nonce-netdump' && 'capture-receiver' || 'prime-receiver' }}
    steps:
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep the receiver through the debug boot control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KDP_REPORT_CERT: ${{ inputs.report_cert }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/recovery_netdump.py "$NETDUMP_RECEIVER_COMMAND"
      - name: Preserve the filtered network control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netdump-${{ inputs.after_debug_boot == 'panic-nonce-netdump' && 'capture' || 'prime' }}-receiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/netdump-discovery.json
          if-no-files-found: warn
  netdump_synthetic_capture:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Code-Hex/vz-ci-test' && github.ref == 'refs/heads/main' && inputs.netdump_synthetic_capture_only }}
    name: Netdump synthetic capture (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: intel
            command: synthetic-sender
            os: macos-26-intel
          - role: receiver
            command: synthetic-receiver
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    permissions:
      contents: read
      checks: write
      actions: read
    env:
      KDP_ROLE: ${{ matrix.role }}
      KDP_PORT_MODE: kernel-source
      KDP_STUN_HOST: stun.cloudflare.com
      KDP_STUN_PORT: '3478'
    steps:
      - name: Reject conflicting network and after-boot controls
        env:
          AFTER_DEBUG_BOOT: ${{ inputs.after_debug_boot || 'none' }}
          DISCOVERY_ONLY: ${{ inputs.netdump_discovery_only && '1' || '0' }}
        run: |
          if [ "$AFTER_DEBUG_BOOT" != none ] || [ "$DISCOVERY_ONLY" != 0 ]; then
            echo 'Choose one network-only control or one after-boot control.' >&2
            exit 1
          fi
      - name: Check out trusted diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture the synthetic fragment independently
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KDP_REPORT_CERT: ${{ inputs.report_cert }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/recovery_netdump.py ${{ matrix.command }}
      - name: Preserve the filtered synthetic result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netdump-synthetic-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug/netdump-discovery.json
          if-no-files-found: warn
